[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora"
version = "1.0.0"
description = "Android Automation & Personal Knowledge Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "pydantic>=2.10.0",
    "pillow>=11.0.0",
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.10.0",
    "imagehash>=4.3.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "rich>=13.0.0",
]

[project.scripts]
nexora = "nexora.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
