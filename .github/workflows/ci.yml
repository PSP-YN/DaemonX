name: DaemonX CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y adb tesseract-ocr tesseract-ocr-eng libgl1 libglib2.0-0

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-asyncio

    - name: Run DaemonX Diagnostics
      run: |
        python -m daemonx.cli doctor

    - name: Run Automated Test Suite
      run: |
        pytest tests/ -v
